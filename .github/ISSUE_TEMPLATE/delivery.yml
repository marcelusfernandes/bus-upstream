name: Delivery
description: Issue gerada após Problem Ready + Solution Deliver + readiness aprovado.
title: "<type>: "
body:
  - type: dropdown
    id: size
    attributes: {label: Tamanho, options: [S, M, L]}
    validations: {required: true}
  - type: textarea
    id: story
    attributes: {label: User Story}
    validations: {required: true}
  - type: textarea
    id: context
    attributes: {label: Contexto}
    validations: {required: true}
  - type: textarea
    id: current
    attributes: {label: Cenário atual}
    validations: {required: true}
  - type: textarea
    id: problem
    attributes: {label: Problema}
    validations: {required: true}
  - type: textarea
    id: consequences
    attributes: {label: Consequências do problema}
    validations: {required: true}
  - type: textarea
    id: solution
    attributes: {label: O que é a solução}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Resultado esperado}
    validations: {required: true}
  - type: textarea
    id: ac
    attributes: {label: Acceptance Criteria}
    validations: {required: true}
  - type: textarea
    id: proof
    attributes: {label: Proof / Validation}
    validations: {required: true}
  - type: textarea
    id: files
    attributes: {label: Files / Scope}
    validations: {required: true}
  - type: textarea
    id: out
    attributes: {label: Fora de escopo}
  - type: textarea
    id: refs
    attributes: {label: References, description: "Evidence IDs, decisions e fontes técnicas."}
